# Anthropic SSE Protocol Template
# Used by: Anthropic Claude
#
# This template defines the streaming configuration for Anthropic's
# Server-Sent Events format with explicit event types.

format: text/event-stream
parser: anthropic_sse

# Event handlers
events:
  - type: message_start
    extract: message
    action: start

  - type: content_block_start
    extract: content_block
    action: content_start

  - type: content_block_delta
    extract: delta.text
    action: content
    filter: delta.text

  - type: content_block_delta
    extract: delta.partial_json
    action: tool_call
    filter: delta.partial_json

  - type: content_block_stop
    extract: index
    action: content_stop

  - type: message_delta
    extract: delta
    action: usage_update

  - type: message_stop
    extract: type
    action: stop

  - type: error
    extract: error
    action: error

# Response field extraction paths
extract:
  content: delta.text
  usage.input_tokens: message.usage.input_tokens
  usage.output_tokens: usage.output_tokens
  usage.cache_read: message.usage.cache_read_input_tokens
  usage.cache_write: message.usage.cache_creation_input_tokens
