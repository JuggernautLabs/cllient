service:
  name: Avian
  base_url: https://api.avian.io/

http:
  request: |
    POST /v1/chat/completions HTTP/1.1
    Host: api.avian.io
    Content-Type: application/json
    Authorization: Bearer ${AVIAN_API_KEY}

    {
      "model": "{{model_id}}",
      "messages": {{json messages}},
      "temperature": {{temperature}},
      "max_tokens": {{max_tokens}},
      "stream": {{stream}}
    }

streaming:
  format: text/event-stream
  parser: openai_sse
  line_prefix: "data: "
  done_marker: "[DONE]"
  events:
    - type: data
      extract: choices[0].delta.content
      action: content
      filter: choices[0].delta.content
    - type: data
      extract: choices[0].delta.role
      action: role_start
      filter: choices[0].delta.role
    - type: data
      extract: choices[0].finish_reason
      action: finish
      filter: choices[0].finish_reason

response:
  success_codes: [200]
  extract:
    content: choices[0].message.content
    role: choices[0].message.role
    finish_reason: choices[0].finish_reason
    usage:
      input: usage.prompt_tokens
      output: usage.completion_tokens
      total: usage.total_tokens
  error:
    message: error.message
    type: error.type
    code: error.code

message_builder: openai  # Avian uses OpenAI-compatible message format

# Rate limiting based on Avian's limits
rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 1000000
  concurrent_requests: 10

# Optional fields that can be injected based on capabilities
optional:
  top_p: |
    "top_p": {{top_p}},
  frequency_penalty: |
    "frequency_penalty": {{frequency_penalty}},
  presence_penalty: |
    "presence_penalty": {{presence_penalty}},
  stop: |
    "stop": {{json stop}},