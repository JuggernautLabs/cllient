[package]
name = "cllient"
version = "0.1.0"
edition = "2021"
description = "A comprehensive Rust client for LLM APIs with unified interface and model management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JuggernautLabs/cllient"
homepage = "https://github.com/JuggernautLabs/cllient"
documentation = "https://docs.rs/cllient"
keywords = ["llm", "ai", "api", "client", "openai"]
categories = ["api-bindings", "web-programming::http-client"]
authors = ["JuggernautLabs"]
readme = "README.md"
exclude = ["workflow/", "examples/", "tests/", "target/", "openrouter_*.json", "PLAN.md"]

[lib]
name = "cllient"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cllient"
path = "src/bin/cllient.rs"

[[bin]]
name = "cllient-utils"
path = "src/bin/cllient-utils.rs"

[dependencies]
# YAML configuration and JSON
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# HTTP client and async
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Streaming and SSE
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
async-trait = "0.1"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["io", "codec"] }
schemars = "0.8"
bytes = "1.0"

# Template processing
handlebars = "4.5"
regex = "1.10"

# JSON path extraction
jsonpath-rust = "0.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Directory traversal
walkdir = "2.4"

# Environment variable substitution
envsubst = "0.2"
dotenv = "0.15"

# Base64 encoding for multimodal content
base64 = "0.22"

# Embed config files into binary
rust-embed = "8.0"

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3.0"