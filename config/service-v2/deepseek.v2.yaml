# DeepSeek API - Config-Driven v2 Schema
# DeepSeek is OpenAI-compatible, using the same message and streaming formats

service:
  name: DeepSeek
  base_url: https://api.deepseek.com
  status: verified
  description: DeepSeek reasoning and chat models
  documentation_url: https://platform.deepseek.com/docs

http:
  request: |
    POST /v1/chat/completions HTTP/1.1
    Host: api.deepseek.com
    Content-Type: application/json
    Authorization: Bearer ${DEEPSEEK_API_KEY}

    {
      "model": "{{model_id}}",
      "messages": {{messages}},
      "temperature": {{temperature}},
      "max_tokens": {{max_tokens}},
      "stream": {{stream}}
    }
  timeout_ms: 60000
  retry:
    max_attempts: 3
    initial_delay_ms: 1000
    backoff_multiplier: 2
    retry_codes: [429, 500, 502, 503]

optional:
  top_p: |
    ,
    "top_p": {{top_p}}
  frequency_penalty: |
    ,
    "frequency_penalty": {{frequency_penalty}}
  presence_penalty: |
    ,
    "presence_penalty": {{presence_penalty}}
  stop: |
    ,
    "stop": {{json stop}}

# Message format definition - replaces hardcoded `message_builder: openai`
# DeepSeek uses OpenAI-compatible message format
message_format:
  name: openai
  roles:
    user: user
    assistant: assistant
    system: system
    tool: tool

  system_handling: inline  # System messages are regular messages with role "system"

  blocks:
    # Text content block
    text: '{"type": "text", "text": {{json value}}}'

    # Image content blocks
    image:
      "image/jpeg": '{"type": "image_url", "image_url": {"url": "data:image/jpeg;base64,{{data}}"}}'
      "image/png": '{"type": "image_url", "image_url": {"url": "data:image/png;base64,{{data}}"}}'
      "image/gif": '{"type": "image_url", "image_url": {"url": "data:image/gif;base64,{{data}}"}}'
      "image/webp": '{"type": "image_url", "image_url": {"url": "data:image/webp;base64,{{data}}"}}'
      "url": '{"type": "image_url", "image_url": {"url": {{json url}}}}'

    # Tool use block
    tool_use: |
      {
        "id": {{json id}},
        "type": "function",
        "function": {
          "name": {{json name}},
          "arguments": {{json input}}
        }
      }

    # Tool result message
    tool_result: '{"role": "tool", "tool_call_id": {{json tool_use_id}}, "content": {{json content}}}'

  # Complete message template
  message: '{"role": {{json role}}, "content": {{content}}}'

  content_array: true   # Content can be an array for multimodal
  string_shorthand: true  # DeepSeek accepts plain string for text-only content

# Streaming configuration - references reusable template
# DeepSeek is OpenAI-compatible, so it uses the openai_sse template
streaming:
  template: openai_sse  # Reference to streaming-templates.yaml

response:
  success_codes: [200]
  extract:
    content: choices[0].message.content
    role: choices[0].message.role
    finish_reason: choices[0].finish_reason
    message_id: id
    model: model
    usage:
      input: usage.prompt_tokens
      output: usage.completion_tokens
      total: usage.total_tokens
    tool_calls: choices[0].message.tool_calls
  error:
    message: error.message
    type: error.type
    code: error.code

rate_limits:
  requests_per_minute: 60
  tokens_per_minute: 1000000
  concurrent_requests: 10

authentication:
  type: api_key
  env_var: DEEPSEEK_API_KEY
  header: Authorization
